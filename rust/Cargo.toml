[package]
name = "tradenex_core"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `android` exposes the JNI entry points. Turn it off (`--no-default-features`) to
# build and test the pure maths without the jni crate.
default = ["android"]
android = ["dep:jni"]

[dependencies]
jni = { version = "0.21", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
